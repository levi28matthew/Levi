name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Applies every migration to a throwaway Postgres and runs the SQL assertions.
      # Docker is available on ubuntu-latest runners.
      - run: npm run db:test
      - run: npm run build
